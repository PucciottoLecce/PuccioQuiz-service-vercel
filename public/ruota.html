    <title>PuccioQuiz — Ruota della Fortuna</title>
    <meta name="theme-color" content="#c0392b">
    <link rel="icon" type="image/svg+xml" href="logol.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream:  #faf8f5;
            --white:  #ffffff;
            --black:  #1a1a1a;
            --red:    #c0392b;
            --red2:   #a93226;
            --border: #e8e4e0;
            --muted:  #999;
            --green:         #4a7a40;
            --green-bg:      #f3faf0;
            --green-border:  rgba(80,160,60,0.2);
        }

        html, body {
            min-height: 100%;
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--black);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
        }

        /* ── HEADER ── */
        .logo-wrap {
            display: flex; flex-direction: column; align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            animation: fadeDown 0.45s ease both;
        }
        .logo-wrap svg { width: 110px; height: auto; display: block; }
        .quiz-badge {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--red); color: #fff;
            font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
            text-transform: uppercase; padding: 3px 9px;
            border-radius: 50px; width: fit-content;
        }

        /* ── CARD ── */
        .card {
            width: 100%; max-width: 520px;
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 14px 14px 18px;
            animation: fadeUp 0.45s 0.08s ease both;
        }

        .card-title {
            font-family: 'Lobster', cursive;
            font-size: 22px; color: var(--black);
            margin-bottom: 2px; text-align: center;
        }
        .card-title span { color: var(--red); }
        .card-subtitle {
            font-size: 12px; color: var(--muted);
            line-height: 1.45; margin-bottom: 10px; text-align: center;
        }

        /* ── DISCLAIMER ── */
        .disclaimer {
            padding: 7px 10px; border-radius: 9px;
            background: var(--green-bg); border: 1.5px solid var(--green-border);
            display: flex; gap: 7px; align-items: flex-start;
            margin-bottom: 12px;
        }
        .disclaimer p { font-size: 10.5px; color: var(--green); line-height: 1.4; margin: 0; }
        .disclaimer strong { color: #3a6830; }

        /* ── WHEEL ── */
        .wheel-section {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
        }

        .wheel-outer {
            width: min(320px, 84vw);
            height: min(320px, 84vw);
            position: relative;
        }

        .wheel-outer::before {
            content: '';
            position: absolute; inset: -8px; border-radius: 50%;
            background: conic-gradient(
                rgba(192,57,43,0.07) 0deg, rgba(232,228,224,0.5) 90deg,
                rgba(192,57,43,0.07) 180deg, rgba(232,228,224,0.5) 270deg,
                rgba(192,57,43,0.07) 360deg
            );
            border: 1.5px solid var(--border);
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        }

        .wheel-wrapper {
            position: relative; width: 100%; height: 100%;
            border-radius: 50%; border: 4px solid var(--border); overflow: visible;
            box-shadow: 0 8px 32px rgba(192,57,43,0.12), 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Pointer — nero */
        .pointer {
            position: absolute; top: -18px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-top: 30px solid #1a1a1a;
            z-index: 10;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
        }
        .pointer::after {
            content: '';
            position: absolute; top: -34px; left: -7px;
            width: 14px; height: 7px; border-radius: 50%;
            background: #333;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        canvas {
            width: 100%; height: 100%; border-radius: 50%;
            transition: transform 6s cubic-bezier(0.15, 0.85, 0.15, 1);
            will-change: transform;
        }

        .logo-center {
            position: absolute; top: 50%; left: 50%;
            width: 76px; height: 76px;
            margin-top: -38px; margin-left: -38px;
            z-index: 9; display: flex; align-items: center; justify-content: center;
            overflow: hidden; padding: 5px;
            background: var(--white); border-radius: 50%;
            border: 2px solid var(--border);
            box-shadow: 0 0 0 3px rgba(192,57,43,0.08), 0 4px 16px rgba(0,0,0,0.12);
            transition: transform 6s cubic-bezier(0.15, 0.85, 0.15, 1);
            will-change: transform;
        }
        .logo-center img { width: 78%; height: 78%; object-fit: contain; }

        /* ── SPIN BUTTON ── */
        .spin-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--red); color: #fff;
            border: none; padding: 14px 32px;
            min-height: 50px; border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(192,57,43,0.28);
            transition: background 0.18s ease, transform 0.18s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .spin-btn:hover:not(:disabled) { background: var(--red2); transform: translateY(-1px); }
        .spin-btn:active:not(:disabled) { transform: translateY(0); }
        .spin-btn:disabled {
            background: var(--border); color: var(--muted);
            cursor: not-allowed; box-shadow: none; transform: none;
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease; padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: var(--white); border: 1.5px solid var(--border);
            border-radius: 20px; padding: 30px 24px;
            max-width: 420px; width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
            transform: scale(0.92) translateY(10px);
            transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

        .modal-title { font-family: 'Lobster', cursive; font-size: 26px; color: var(--black); margin: 0 0 12px; }
        .modal-title.win { color: var(--red); }

        .modal-text { font-size: 14px; line-height: 1.65; color: var(--muted); margin-bottom: 10px; }
        .modal-text strong { color: var(--black); font-size: 1.05em; }

        .modal-prize-badge {
            display: inline-block; margin: 10px 0;
            padding: 8px 20px; border-radius: 50px;
            background: #fff5f4; border: 1.5px solid rgba(192,57,43,0.2);
            color: var(--red); font-weight: 700; font-size: 17px;
        }

        .modal-btns {
            display: flex; gap: 9px; justify-content: center;
            flex-wrap: wrap; margin-top: 22px;
        }
        .modal-btns button {
            border: none; border-radius: 12px; padding: 13px 22px;
            font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 15px;
            cursor: pointer; min-height: 48px;
            transition: transform 0.12s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .modal-btns button:hover { transform: translateY(-1px); }

        #closeModalBtn { background: var(--red); color: #fff; box-shadow: 0 4px 14px rgba(192,57,43,0.22); }
        #closeModalBtn:hover { background: var(--red2); }
        #exitBtn { background: var(--cream); color: var(--muted); border: 1.5px solid var(--border); }
        #exitBtn:hover { background: var(--border); }

        @keyframes fadeDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeUp   { from { opacity:0; transform:translateY(12px);  } to { opacity:1; transform:translateY(0); } }

        @media (max-width: 480px) {
            body { padding-top: 12px; }
            .card { padding: 12px 12px 16px; border-radius: 16px; }
            .card-title { font-size: 20px; }
            .wheel-outer { width: 86vw; height: 86vw; }
            .logo-center { width: 62px; height: 62px; margin-top: -31px; margin-left: -31px; }
            .spin-btn { font-size: 15px; padding: 13px 26px; }
            .modal-content { padding: 20px 14px; }
        }

        @media (max-width: 340px) {
            .wheel-outer { width: 88vw; height: 88vw; }
            .logo-center { width: 52px; height: 52px; margin-top: -26px; margin-left: -26px; }
        }
    </style>
</head>

<script>
    // ── SAFE localStorage ──
    function lsGet(key)      { try { return localStorage.getItem(key); }      catch(_) { return null; } }
    function lsSet(key, val) { try { localStorage.setItem(key, val); }        catch(_) {} }
    function lsRemove(key)   { try { localStorage.removeItem(key); }          catch(_) {} }

    // ── SICUREZZA: escapeHtml ──
    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ── API BASE ──
    function puccioApiBaseSync() {
        if (typeof window.__PUCCIO_RESOLVED_API_BASE__ === 'string') return window.__PUCCIO_RESOLVED_API_BASE__;
        if (typeof window.__PUCCIO_QUIZ_API__ === 'string' && window.__PUCCIO_QUIZ_API__.length)
            return String(window.__PUCCIO_QUIZ_API__).replace(/\/$/, '');
        const custom = document.querySelector('meta[name="puccio-api-base"]');
        if (custom) { const u = (custom.getAttribute('content') || '').trim(); if (u) return u.replace(/\/$/, ''); }
        const back = document.querySelector('meta[name="puccio-backend"]');
        if (back) {
            const o = (back.getAttribute('content') || '').trim();
            if (o && o.indexOf('__') === -1) { if (o === window.location.origin) return ''; return o.replace(/\/$/, ''); }
        }
        return null;
    }

    async function resolvePuccioApiBase() {
        const sync = puccioApiBaseSync();
        if (sync !== null) { window.__PUCCIO_RESOLVED_API_BASE__ = sync; return sync; }
        async function tryHealth(base) {
            const origin = base === '' ? window.location.origin : base;
            try {
                const r = await fetch(origin + '/api/health', { method: 'GET', cache: 'no-store' });
                if (!r.ok) return null;
                const j = await r.json().catch(() => ({}));
                if (j && j.service === 'puccioquiz-backend') return base;
            } catch(e) {}
            return null;
        }
        const h = window.location.hostname;
        const isLocal = h === '127.0.0.1' || h === 'localhost' || h === '[::1]';
        const portMeta = document.querySelector('meta[name="puccio-api-port"]');
        const alt = (portMeta && (portMeta.getAttribute('content') || '').trim()) || '3000';
        const list = [''];
        if (isLocal) { list.push('http://127.0.0.1:' + alt); if (alt !== '3000') list.push('http://127.0.0.1:3000'); }
        for (let i = 0; i < list.length; i++) {
            const hit = await tryHealth(list[i]);
            if (hit !== null) { window.__PUCCIO_RESOLVED_API_BASE__ = hit; return hit; }
        }
        if (window.location.protocol === 'file:') {
            window.__PUCCIO_RESOLVED_API_BASE__ = 'http://127.0.0.1:' + alt;
            return window.__PUCCIO_RESOLVED_API_BASE__;
        }
        window.__PUCCIO_RESOLVED_API_BASE__ = '';
        return '';
    }

    // ── AUDIO ──
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playWinSound() {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    }

    function playSpinSound() {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(250, now + 0.1);
        osc.frequency.linearRampToValueAtTime(150, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.setValueAtTime(0.15, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.05, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    }

    function playSpinningLoop(duration) {
        const interval = 150; let elapsed = 0;
        const id = setInterval(() => {
            if (elapsed >= duration) {
                clearInterval(id);
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                return;
            }
            playSpinSound();
            elapsed += interval;
        }, interval);
    }

    // ── SLICES — palette chiara coerente con design system ──
    const slicesConfig = [
        { name:'Crocchettone', color:'#e8e0d5', textColor:'#8b2218' },
        { name:'Portachiavi',  color:'#c0392b', textColor:'#ffffff' },
        { name:'Crocchettone', color:'#e8e0d5', textColor:'#8b2218' },
        { name:'Portachiavi',  color:'#c0392b', textColor:'#ffffff' },
        { name:'Pucciotto',    color:'#1a1a1a', textColor:'#f0c97a' },
        { name:'Crocchettone', color:'#e8e0d5', textColor:'#8b2218' },
        { name:'Portachiavi',  color:'#c0392b', textColor:'#ffffff' },
        { name:'Crocchettone', color:'#e8e0d5', textColor:'#8b2218' },
        { name:'Portachiavi',  color:'#c0392b', textColor:'#ffffff' },
        { name:'Crocchettone', color:'#e8e0d5', textColor:'#8b2218' },
        { name:'Maglietta',    color:'#6b1a13', textColor:'#f0c97a' },
        { name:'Pucciotto',    color:'#1a1a1a', textColor:'#f0c97a' },
        { name:'Crocchettone', color:'#e8e0d5', textColor:'#8b2218' },
        { name:'Portachiavi',  color:'#c0392b', textColor:'#ffffff' },
        { name:'Crocchettone', color:'#e8e0d5', textColor:'#8b2218' },
        { name:'Portachiavi',  color:'#c0392b', textColor:'#ffffff' },
        { name:'Crocchettone', color:'#e8e0d5', textColor:'#8b2218' },
        { name:'Portachiavi',  color:'#c0392b', textColor:'#ffffff' },
        { name:'Crocchettone', color:'#e8e0d5', textColor:'#8b2218' },
        { name:'Portachiavi',  color:'#c0392b', textColor:'#ffffff' },
    ];

    const totalSlices = slicesConfig.length;
    const sliceAngle  = 360 / totalSlices;

    const canvas              = document.getElementById('wheelCanvas');
    const ctx                 = canvas.getContext('2d');
    const spinBtn             = document.getElementById('spinBtn');
    const resultModal         = document.getElementById('resultModal');
    const modalTitle          = document.getElementById('modalTitle');
    const modalBody           = document.getElementById('modalBody');
    const closeModalBtn       = document.getElementById('closeModalBtn');
    const exitBtn             = document.getElementById('exitBtn');
    const logoCenterContainer = document.getElementById('logoCenterContainer');

    let currentRotation = 0;
    let isSpinning  = false;
    let wheelLocked = false;

    // ── FRONTEND ANTI-RESPIN FALLBACK ──
    // Blocca ulteriori spin nella stessa sessione anche se il backend non risponde con 409.
    // Complementare alla logica server (non la sostituisce).
    const SPIN_DONE_KEY = 'puccioQuiz_spinDone';
    function markSpinDone(prizeName) {
        lsSet(SPIN_DONE_KEY, JSON.stringify({ prize: prizeName, ts: Date.now() }));
    }
    function wasSpinDone() {
        try {
            const raw = lsGet(SPIN_DONE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            // Valido per 24h come fallback
            return data && data.ts && (Date.now() - data.ts < 86400000);
        } catch(_) { return false; }
    }

    function lockWheelUi(buttonLabel) {
        wheelLocked = true;
        spinBtn.disabled = true;
        if (buttonLabel) spinBtn.textContent = buttonLabel;
    }

    function getExitUrl() {
        const meta = document.querySelector('meta[name="puccio-exit-url"]');
        const u = meta ? (meta.getAttribute('content') || '').trim() : '';
        return u || 'about:blank';
    }

    function clearSession() {
        lsRemove('puccioQuiz_email');
        lsRemove('puccioQuiz_q10');
        lsRemove('puccioQuiz_missedList');
        lsRemove(SPIN_DONE_KEY);
    }

    function tryExitPage() {
        clearSession();
        try { window.close(); } catch(_) {}
        window.location.href = 'fine.html?exit=' + encodeURIComponent(getExitUrl());
    }

    async function bootstrapWheelPage() {
        const email = (lsGet('puccioQuiz_email') || '').trim();
        if (!email) { window.location.replace('test.html'); return; }

        // Controllo fallback locale PRIMA della chiamata API
        if (wasSpinDone()) {
            lockWheelUi('Già utilizzata');
            const subtitle = document.getElementById('pageSubtitle');
            if (subtitle) subtitle.textContent = 'Hai già girato la ruota. Il token è stato inviato via email.';
            return;
        }

        try {
            const r = await fetch((await resolvePuccioApiBase()) + '/api/participation-state', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) return;
            if (!j.exists)     { window.location.replace('test.html');  return; }
            if (!j.testPassed) { window.location.replace('perso.html'); return; }
            if (j.wheelDone) {
                lsSet(SPIN_DONE_KEY, JSON.stringify({ prize: j.prize_name || '', ts: Date.now() }));
                lockWheelUi('Già utilizzata');
                const subtitle = document.getElementById('pageSubtitle');
                if (subtitle) {
                    const prizeName = escapeHtml(String(j.prize_name || 'Gadget'));
                    const until = j.prize_valid_until ? new Date(j.prize_valid_until).toLocaleString('it-IT') : '';
                    subtitle.innerHTML =
                        'Hai già girato la ruota con questa email.<br>' +
                        '<strong style="color:var(--red);">' + prizeName + '</strong><br>' +
                        '<span style="font-size:0.85rem;color:var(--muted);">Il token è stato inviato via email.</span>' +
                        (until ? '<br><span style="font-size:0.85rem;color:var(--muted);">Valido fino al: ' + escapeHtml(until) + '</span>' : '');
                }
            }
        } catch(_) {}
    }

    function drawWheel() {
        const cx = canvas.width / 2, cy = canvas.height / 2, r = cx;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < totalSlices; i++) {
            const sa = (i * sliceAngle - 90) * (Math.PI / 180);
            const ea = ((i + 1) * sliceAngle - 90) * (Math.PI / 180);

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, sa, ea);
            ctx.closePath();
            ctx.fillStyle = slicesConfig[i].color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(232,228,224,0.9)';
            ctx.stroke();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(sa + (sliceAngle / 2) * (Math.PI / 180));
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = slicesConfig[i].textColor;
            // Font adattivo alla dimensione canvas
            const fontSize = Math.max(14, Math.round(canvas.width * 0.028));
            ctx.font = `bold ${fontSize}px 'DM Sans', sans-serif`;
            ctx.fillText(slicesConfig[i].name, r - 40, 0);
            ctx.restore();
        }

        // Centro bianco
        ctx.beginPath();
        ctx.arc(cx, cy, 65, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = 'rgba(232,228,224,1)';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function spinWheel() {
        if (wheelLocked || isSpinning) return;
        // Doppio check anti-respin locale
        if (wasSpinDone()) { lockWheelUi('Già utilizzata'); return; }

        isSpinning = true;
        spinBtn.disabled = true;

        // Risveglia AudioContext (richiede gesto utente — il click è il trigger)
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playSpinningLoop(6000);

        currentRotation = currentRotation + (360 - (currentRotation % 360));
        const winningIndex    = Math.floor(Math.random() * totalSlices);
        const sliceCenterDeg  = winningIndex * sliceAngle + (sliceAngle / 2);
        const targetRotation  = currentRotation + 360 * 8 + (360 - sliceCenterDeg);
        currentRotation = targetRotation;

        canvas.style.transform              = `rotate(${currentRotation}deg)`;
        logoCenterContainer.style.transform = `rotate(${currentRotation}deg)`;

        canvas.addEventListener('transitionend', async function handler() {
            canvas.removeEventListener('transitionend', handler);
            try {
                await showResult(slicesConfig[winningIndex].name);
            } finally {
                isSpinning = false;
                spinBtn.disabled = false;
            }
        });
    }

    function renderPrizeModal(prizeName, prizeValidUntil, errMsg, errIsHtml) {
        if (errMsg) {
            modalTitle.textContent = 'Attenzione';
            modalTitle.className = 'modal-title';
            modalBody.innerHTML =
                '<p class="modal-text">' + (errIsHtml ? String(errMsg) : escapeHtml(errMsg)) + '</p>' +
                (prizeName ? '<p style="font-size:0.85rem;color:var(--muted);margin-top:8px;">Segmento: <strong>' + escapeHtml(prizeName) + '</strong></p>' : '');
        } else {
            modalTitle.textContent = 'Hai Vinto! 🎉';
            modalTitle.className = 'modal-title win';
            const until = prizeValidUntil ? new Date(prizeValidUntil).toLocaleString('it-IT') : '';
            modalBody.innerHTML =
                '<p class="modal-text">Complimenti! Il tuo gadget all\'apertura:</p>' +
                '<div class="modal-prize-badge">' + escapeHtml(prizeName) + '</div>' +
                '<p class="modal-text" style="margin-top:12px;">Ti abbiamo inviato il <strong>token via email</strong>. Controlla anche lo spam.</p>' +
                (until ? '<p style="font-size:0.85rem;color:var(--muted);margin-top:4px;">Valido fino al: ' + escapeHtml(until) + '</p>' : '') +
                '<p style="font-size:0.85rem;color:var(--muted);margin-top:8px;">Mostra il token alla cassa all\'apertura per ritirare il tuo gadget.</p>';
        }
        resultModal.classList.add('active');
        resultModal.setAttribute('aria-hidden', 'false');
    }

    async function showResult(prizeName) {
        playWinSound();
        setTimeout(() => playWinSound(), 200);
        setTimeout(() => playWinSound(), 400);

        const email = (lsGet('puccioQuiz_email') || '').trim();
        if (!email) {
            renderPrizeModal(prizeName, '', 'Email non trovata. Torna al quiz e invia di nuovo il modulo.', false);
            return;
        }

        // Salva subito il flag locale PRIMA di chiamare il server
        // (se l'utente chiude la pagina durante la chiamata, non può rigirare)
        markSpinDone(prizeName);

        try {
            const base = await resolvePuccioApiBase();
            const r = await fetch(base + '/api/spin-result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, prizeName })
            });
            const j = await r.json().catch(() => ({}));

            if (r.status === 409) {
                renderPrizeModal(prizeName, j.prize_valid_until || '', j.error || 'Hai già girato la ruota con questa email.', false);
                lockWheelUi('Già utilizzata');
                return;
            }
            if (!r.ok || !j.ok) {
                const errText = (j && j.error) ? String(j.error) : ('Errore server (' + r.status + ')');
                const extraHtml = escapeHtml(errText) +
                    '<br><br><button id="resendBtn" style="margin-top:10px;font-size:14px;padding:12px 22px;min-height:44px;background:var(--red);color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:700;touch-action:manipulation;">Reinvia email</button>';
                renderPrizeModal(prizeName, j.prize_valid_until || '', extraHtml, true);
                setTimeout(() => {
                    const btn = document.getElementById('resendBtn');
                    if (!btn) return;
                    btn.addEventListener('click', async () => {
                        btn.disabled = true; btn.textContent = 'Invio…';
                        try {
                            const rr = await fetch((await resolvePuccioApiBase()) + '/api/resend-token', {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ email })
                            });
                            const jj = await rr.json().catch(() => ({}));
                            if (!rr.ok || !jj.ok) throw new Error(jj.error || ('HTTP ' + rr.status));
                            btn.textContent = 'Inviata! ✓';
                        } catch(e) { btn.textContent = 'Errore: riprova'; btn.disabled = false; }
                    });
                }, 0);
                return;
            }
            renderPrizeModal(prizeName, j.prize_valid_until, '', false);
            lockWheelUi('Già utilizzata');
        } catch(e) {
            renderPrizeModal(prizeName, '', 'Connessione al server non riuscita.', false);
        }
    }

    spinBtn.addEventListener('click', spinWheel);

    closeModalBtn.addEventListener('click', () => {
        resultModal.classList.remove('active');
        resultModal.setAttribute('aria-hidden', 'true');
    });

    exitBtn.addEventListener('click', () => { tryExitPage(); });

    // Chiudi modal cliccando overlay
    resultModal.addEventListener('click', (e) => {
        if (e.target === resultModal) {
            resultModal.classList.remove('active');
            resultModal.setAttribute('aria-hidden', 'true');
        }
    });

    (async function initPage() {
        await resolvePuccioApiBase().catch(() => {});
        await bootstrapWheelPage();
        drawWheel();
    })();
</script>
</body>
</html>
