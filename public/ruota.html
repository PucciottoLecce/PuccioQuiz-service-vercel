<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="puccio-api-base" content="" />
    <meta name="puccio-api-port" content="" />
    <meta name="puccio-backend" content="__BACKEND_ORIGIN__" />
    <meta name="puccio-exit-url" content="about:blank" />
    <title>PuccioQuiz — Ruota della Fortuna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        *{ box-sizing:border-box; margin:0; padding:0; }

        :root{
            --bg:#080706;
            --surface:#110f0d;
            --surface2:#181410;
            --bordeaux:#8b1a2e;
            --bordeaux-bright:#c0243d;
            --gold:#c9a84c;
            --gold-light:#e8c96a;
            --cream:#f0e8d8;
            --muted:#a09080;
            --sage:#8fa87e;
        }

        html, body{
            min-height:100vh;
            background: var(--bg);
            color: var(--cream);
            font-family:'DM Sans',sans-serif;
            -webkit-font-smoothing:antialiased;
            display:flex;
            flex-direction:column;
            align-items:center;
            overflow-x:hidden;
            padding:32px 20px 40px;
        }

        body::before{
            content:'';
            position:fixed;
            inset:0;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity:0.025;
            pointer-events:none;
            z-index:0;
        }

        body::after{
            content:'';
            position:fixed;
            inset:0;
            background:
                radial-gradient(ellipse 70% 50% at 50% 100%, rgba(139,26,46,0.1) 0%, transparent 60%),
                radial-gradient(ellipse 40% 30% at 90% 10%, rgba(201,168,76,0.05) 0%, transparent 60%);
            pointer-events:none;
            z-index:0;
        }

        .page-wrap{
            position:relative;
            z-index:1;
            width:100%;
            max-width:560px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:0;
        }

        /* Page header */
        .page-header{
            display:flex;
            align-items:center;
            gap:14px;
            width:100%;
            margin-bottom:28px;
        }
        .page-logo{
            width:44px; height:44px;
            border-radius:50%;
            background:var(--surface2);
            border:1px solid rgba(201,168,76,0.15);
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
        }
        .page-logo img{ width:68%; height:68%; object-fit:contain; }
        .page-meta { flex:1; }
        .page-eyebrow{
            font-size:10px; font-weight:700;
            letter-spacing:0.16em; text-transform:uppercase;
            color:var(--gold); margin-bottom:2px;
        }
        .page-name{
            font-family:'Playfair Display',serif;
            font-size:1.3rem; font-weight:900; color:var(--cream);
        }

        /* Header title */
        .game-header{
            text-align:center;
            margin-bottom:28px;
            width:100%;
        }
        .game-header h1{
            font-family:'Playfair Display',serif;
            font-size:clamp(1.8rem,6vw,2.6rem);
            font-weight:900;
            line-height:1.1;
            letter-spacing:-0.02em;
            color:var(--cream);
            margin-bottom:8px;
        }
        .game-header h1 em{
            font-style:italic;
            background:linear-gradient(90deg, var(--gold-light), var(--bordeaux-bright));
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
        }
        .game-header .subtitle{
            color:var(--muted);
            font-size:14.5px;
            line-height:1.55;
        }

        /* Disclaimer */
        .disclaimer{
            margin-bottom:24px;
            padding:11px 15px;
            border-radius:10px;
            background:rgba(143,168,126,0.05);
            border:1px solid rgba(143,168,126,0.12);
            display:flex;
            gap:10px;
            align-items:flex-start;
            width:100%;
        }
        .disclaimer p{ font-size:12px; color:rgba(143,168,126,0.8); line-height:1.5; margin:0; }
        .disclaimer strong{ color:rgba(143,168,126,1); }

        /* Wheel area */
        .game-area{
            position:relative;
            display:flex;
            flex-direction:column;
            align-items:center;
            width:100%;
        }

        .wheel-outer{
            width:min(400px, 88vw);
            height:min(400px, 88vw);
            position:relative;
            margin-bottom:28px;
        }

        /* Decorative outer ring */
        .wheel-outer::before{
            content:'';
            position:absolute;
            inset:-14px;
            border-radius:50%;
            background: conic-gradient(
                rgba(201,168,76,0.08) 0deg,
                rgba(139,26,46,0.08) 90deg,
                rgba(201,168,76,0.08) 180deg,
                rgba(139,26,46,0.08) 270deg,
                rgba(201,168,76,0.08) 360deg
            );
            border:1px solid rgba(255,255,255,0.04);
            box-shadow:0 0 40px rgba(139,26,46,0.15), 0 0 80px rgba(0,0,0,0.5);
        }

        .wheel-wrapper{
            position:relative;
            width:100%;
            height:100%;
            border-radius:50%;
            border:6px solid rgba(139,26,46,0.4);
            overflow:visible;
            box-shadow:
                0 0 0 2px rgba(201,168,76,0.12),
                0 20px 60px rgba(0,0,0,0.6);
        }

        /* Pointer */
        .pointer{
            position:absolute;
            top:-22px;
            left:50%;
            transform:translateX(-50%);
            width:0; height:0;
            border-left:18px solid transparent;
            border-right:18px solid transparent;
            border-top:40px solid var(--gold);
            z-index:10;
            filter:drop-shadow(0 4px 8px rgba(0,0,0,0.7));
        }
        .pointer::after{
            content:'';
            position:absolute;
            top:-44px;
            left:-10px;
            width:20px; height:10px;
            border-radius:50%;
            background:var(--gold-light);
            box-shadow:0 0 8px rgba(201,168,76,0.5);
        }

        canvas{
            width:100%;
            height:100%;
            border-radius:50%;
            transition:transform 6s cubic-bezier(0.15,0.85,0.15,1);
        }

        /* Center logo */
        .logo-center{
            position:absolute;
            top:50%; left:50%;
            width:110px; height:110px;
            margin-top:-55px; margin-left:-55px;
            z-index:9;
            display:flex; align-items:center; justify-content:center;
            overflow:hidden; padding:8px;
            background:var(--bg);
            border-radius:50%;
            border:2px solid rgba(201,168,76,0.2);
            box-shadow:0 0 0 4px rgba(139,26,46,0.1), 0 8px 24px rgba(0,0,0,0.6);
            transition:transform 6s cubic-bezier(0.15,0.85,0.15,1);
        }
        .logo-center img{
            width:78%; height:78%; object-fit:contain;
        }

        /* Spin button */
        .spin-btn{
            background:linear-gradient(135deg, var(--bordeaux), #5c0f1c);
            color:var(--cream);
            border:none;
            padding:15px 42px;
            font-family:'DM Sans',sans-serif;
            font-size:17px;
            font-weight:700;
            letter-spacing:0.02em;
            border-radius:50px;
            cursor:pointer;
            box-shadow:
                0 12px 36px rgba(139,26,46,0.3),
                inset 0 1px 0 rgba(255,255,255,0.07);
            transition:transform 0.18s ease, box-shadow 0.18s ease;
            position:relative;
            overflow:hidden;
        }
        .spin-btn::after{
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(135deg, rgba(201,168,76,0.08), transparent);
            pointer-events:none;
        }
        .spin-btn:hover:not(:disabled){
            transform:translateY(-2px) scale(1.02);
            box-shadow:0 18px 50px rgba(139,26,46,0.4);
        }
        .spin-btn:disabled{
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.06);
            color:var(--muted);
            cursor:not-allowed;
            transform:none;
            box-shadow:none;
        }

        /* Modal */
        .modal-overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.88);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:100;
            opacity:0;
            pointer-events:none;
            transition:opacity 0.3s ease;
            padding:20px;
        }
        .modal-overlay.active{ opacity:1; pointer-events:all; }

        .modal-content{
            background:linear-gradient(160deg, var(--surface2), var(--surface));
            border:1px solid rgba(255,255,255,0.07);
            border-radius:20px;
            padding:36px 32px;
            max-width:460px;
            width:100%;
            text-align:center;
            box-shadow:0 40px 100px rgba(0,0,0,0.85);
            transform:scale(0.88) translateY(12px);
            transition:transform 0.3s cubic-bezier(0.16,1,0.3,1);
            position:relative;
            overflow:hidden;
        }
        .modal-content::before{
            content:'';
            position:absolute;
            top:0;left:0;right:0;
            height:1px;
            background:linear-gradient(90deg,transparent,rgba(201,168,76,0.3),transparent);
        }
        .modal-overlay.active .modal-content{ transform:scale(1) translateY(0); }

        .modal-title{
            font-family:'Playfair Display',serif;
            font-size:1.6rem;
            font-weight:900;
            color:var(--gold-light);
            margin:0 0 14px;
        }
        .modal-text{
            font-size:14.5px;
            line-height:1.65;
            color:var(--muted);
            margin-bottom:12px;
        }
        .token-box{
            background:rgba(201,168,76,0.06);
            padding:12px 16px;
            border:1px dashed rgba(201,168,76,0.3);
            border-radius:8px;
            font-family:monospace;
            font-size:1.4rem;
            color:var(--gold-light);
            margin:16px 0;
            letter-spacing:5px;
        }

        .modal-btns{
            display:flex; gap:10px; justify-content:center;
            flex-wrap:wrap; margin-top:22px;
        }
        .modal-btns button{
            padding:11px 22px;
            font-family:'DM Sans',sans-serif;
            font-size:14px;
            font-weight:700;
            border-radius:10px;
            cursor:pointer;
            transition:transform 0.12s;
        }
        .modal-btns button:hover{ transform:translateY(-1px); }
        #closeModalBtn{
            background:linear-gradient(135deg, var(--bordeaux), #5c0f1c);
            color:var(--cream);
            border:none;
            box-shadow:0 6px 20px rgba(139,26,46,0.25);
        }
        #exitBtn{
            background:transparent;
            color:var(--muted);
            border:1px solid rgba(255,255,255,0.08);
        }

        @media(max-width:500px){
            .wheel-outer{ width:84vw; height:84vw; }
            .logo-center{ width:80px; height:80px; margin-top:-40px; margin-left:-40px; }
            .game-header h1{ font-size:1.6rem; }
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <!-- Page header -->
    <div class="page-header">
        <div class="page-logo">
            <img src="logol.svg" alt="Pucciotto" />
        </div>

</div>

<script>
    function puccioApiBaseSync() {
        if (typeof window.__PUCCIO_RESOLVED_API_BASE__ === "string") return window.__PUCCIO_RESOLVED_API_BASE__;
        if (typeof window.__PUCCIO_QUIZ_API__ === "string" && window.__PUCCIO_QUIZ_API__.length) {
            return String(window.__PUCCIO_QUIZ_API__).replace(/\/$/, "");
        }
        var custom = document.querySelector('meta[name="puccio-api-base"]');
        if (custom) {
            var u = (custom.getAttribute("content") || "").trim();
            if (u) return u.replace(/\/$/, "");
        }
        var back = document.querySelector('meta[name="puccio-backend"]');
        if (back) {
            var o = (back.getAttribute("content") || "").trim();
            if (o && o.indexOf("__") === -1) {
                if (o === window.location.origin) return "";
                return o.replace(/\/$/, "");
            }
        }
        return null;
    }

    async function resolvePuccioApiBase() {
        var sync = puccioApiBaseSync();
        if (sync !== null) {
            window.__PUCCIO_RESOLVED_API_BASE__ = sync;
            return sync;
        }
        async function tryHealth(base) {
            var origin = base === "" ? window.location.origin : base;
            var url = origin + "/api/health";
            try {
                var r = await fetch(url, { method: "GET", cache: "no-store" });
                if (!r.ok) return null;
                var j = await r.json().catch(function () { return {}; });
                if (j && j.service === "puccioquiz-backend") return base;
            } catch (e) {}
            return null;
        }
        var h = window.location.hostname;
        var isLocal = h === "127.0.0.1" || h === "localhost" || h === "[::1]";
        var portMeta = document.querySelector('meta[name="puccio-api-port"]');
        var alt = (portMeta && (portMeta.getAttribute("content") || "").trim()) || "3000";
        var list = [""];
        if (isLocal) {
            list.push("http://127.0.0.1:" + alt);
            if (alt !== "3000") list.push("http://127.0.0.1:3000");
        }
        for (var i = 0; i < list.length; i++) {
            var hit = await tryHealth(list[i]);
            if (hit !== null) {
                window.__PUCCIO_RESOLVED_API_BASE__ = hit;
                return hit;
            }
        }
        if (window.location.protocol === "file:") {
            window.__PUCCIO_RESOLVED_API_BASE__ = "http://127.0.0.1:" + alt;
            return window.__PUCCIO_RESOLVED_API_BASE__;
        }
        window.__PUCCIO_RESOLVED_API_BASE__ = "";
        return "";
    }

    // === SUONI ===
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function playWinSound() {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioContext.destination);
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    }

    function playSpinSound() {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioContext.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(250, now + 0.1);
        osc.frequency.linearRampToValueAtTime(150, now + 0.2);
        gainNode.gain.setValueAtTime(0.15, now);
        gainNode.gain.setValueAtTime(0.15, now + 0.15);
        gainNode.gain.exponentialRampToValueAtTime(0.05, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    }

    function playSpinningLoop(duration) {
        const interval = 150;
        let elapsed = 0;
        const spinInterval = setInterval(() => {
            if (elapsed >= duration) {
                clearInterval(spinInterval);
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioContext.destination);
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                return;
            }
            playSpinSound();
            elapsed += interval;
        }, interval);
    }

    // === CONFIGURAZIONE SLICES ===
    const slicesConfig = [
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Portachiavi",  color: "#5c0f1c", textColor: "#f0e8d8" },
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Maglietta",    color: "#8b1a2e", textColor: "#e8c96a" },
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Portachiavi",  color: "#5c0f1c", textColor: "#f0e8d8" },
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Portachiavi",  color: "#5c0f1c", textColor: "#f0e8d8" },
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Pucciotto",    color: "#8b1a2e", textColor: "#e8c96a" },
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Portachiavi",  color: "#5c0f1c", textColor: "#f0e8d8" },
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Portachiavi",  color: "#5c0f1c", textColor: "#f0e8d8" },
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Portachiavi",  color: "#5c0f1c", textColor: "#f0e8d8" },
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Portachiavi",  color: "#5c0f1c", textColor: "#f0e8d8" },
        { name: "Crocchettone", color: "#110d0a", textColor: "#c9a84c" },
        { name: "Pucciotto",    color: "#8b1a2e", textColor: "#e8c96a" }
    ];

    const totalSlices = slicesConfig.length;
    const sliceAngle = 360 / totalSlices;

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const resultModal = document.getElementById("resultModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const exitBtn = document.getElementById("exitBtn");
    const logoCenterContainer = document.getElementById("logoCenterContainer");

    let currentRotation = 0;
    let isSpinning = false;
    let wheelLocked = false;

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function lockWheelUi(buttonLabel) {
        wheelLocked = true;
        spinBtn.disabled = true;
        if (buttonLabel) spinBtn.textContent = buttonLabel;
    }

    function getExitUrl() {
        const meta = document.querySelector('meta[name="puccio-exit-url"]');
        const u = meta ? (meta.getAttribute("content") || "").trim() : "";
        return u || "about:blank";
    }

    function clearSession() {
        try {
            localStorage.removeItem("puccioQuiz_email");
            localStorage.removeItem("puccioQuiz_q10");
            localStorage.removeItem("puccioQuiz_missedList");
        } catch (_) {}
    }

    function tryExitPage() {
        clearSession();
        try { window.close(); } catch (_) {}
        const exitUrl = encodeURIComponent(getExitUrl());
        window.location.href = `fine.html?exit=${exitUrl}`;
    }

    async function bootstrapWheelPage() {
        const email = (localStorage.getItem("puccioQuiz_email") || "").trim();
        if (!email) {
            window.location.replace("test.html");
            return;
        }
        try {
            const r = await fetch((await resolvePuccioApiBase()) + "/api/participation-state", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) return;
            if (!j.exists) {
                window.location.replace("test.html");
                return;
            }
            if (!j.testPassed) {
                window.location.replace("perso.html");
                return;
            }
            if (j.wheelDone) {
                lockWheelUi("Già utilizzata");
                const subtitle = document.querySelector(".game-header .subtitle");
                const until = j.prize_valid_until
                    ? new Date(j.prize_valid_until).toLocaleString("it-IT")
                    : "";
                if (subtitle) {
                    const untilHtml = until
                        ? `<br><span style="font-size:0.9rem;opacity:0.6;">Valido fino al: ${escapeHtml(until)}</span>`
                        : "";
                    subtitle.innerHTML =
                        "Hai già girato la ruota con questa email.<br>" +
                        '<strong style="color:var(--gold);">' +
                        escapeHtml(String(j.prize_name || "Gadget")) +
                        "</strong><br><span style='font-size:0.9rem;opacity:0.7;'>Il token è stato inviato via email.</span>" +
                        untilHtml;
                }
            }
        } catch (_) {}
    }

    function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = centerX;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < totalSlices; i++) {
            const startAngle = (i * sliceAngle - 90) * (Math.PI / 180);
            const endAngle = ((i + 1) * sliceAngle - 90) * (Math.PI / 180);

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = slicesConfig[i].color;
            ctx.fill();

            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "rgba(201,168,76,0.15)";
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + (sliceAngle / 2) * (Math.PI / 180));
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillStyle = slicesConfig[i].textColor;
            ctx.font = "bold 26px 'DM Sans', sans-serif";
            ctx.fillText(slicesConfig[i].name, radius - 40, 0);
            ctx.restore();
        }

        // center circle
        ctx.beginPath();
        ctx.arc(centerX, centerY, 65, 0, Math.PI * 2);
        ctx.fillStyle = "#080706";
        ctx.fill();
        ctx.strokeStyle = "rgba(201,168,76,0.15)";
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    function spinWheel() {
        if (wheelLocked || isSpinning) return;
        isSpinning = true;
        spinBtn.disabled = true;

        playSpinningLoop(6000);

        currentRotation = currentRotation + (360 - (currentRotation % 360));

        const winningIndex = Math.floor(Math.random() * totalSlices);
        const sliceCenterDegree = winningIndex * sliceAngle + (sliceAngle / 2);

        const extraSpins = 360 * 8;
        const targetRotation = currentRotation + extraSpins + (360 - sliceCenterDegree);

        currentRotation = targetRotation;
        canvas.style.transform = `rotate(${currentRotation}deg)`;
        logoCenterContainer.style.transform = `rotate(${currentRotation}deg)`;

        canvas.addEventListener('transitionend', async function handleTransitionEnd() {
            canvas.removeEventListener('transitionend', handleTransitionEnd);
            try {
                await showResult(slicesConfig[winningIndex].name);
            } finally {
                isSpinning = false;
                spinBtn.disabled = false;
            }
        });
    }

    function renderPrizeModal(prizeName, prizeValidUntil, errMsg, errIsHtml) {
        modalTitle.textContent = errMsg ? "Attenzione" : "Hai Vinto!";
        modalTitle.style.color = errMsg ? "#ffb3b3" : "var(--gold-light)";
        if (errMsg) {
            modalBody.innerHTML =
                '<p class="modal-text">' +
                (errIsHtml ? String(errMsg) : escapeHtml(errMsg)) +
                "</p>" +
                (prizeName
                    ? '<p style="font-size:0.88rem;color:var(--muted);margin-top:8px;">Segmento: <strong>' +
                      escapeHtml(prizeName) + "</strong></p>"
                    : "");
        } else {
            const until = prizeValidUntil ? new Date(prizeValidUntil).toLocaleString("it-IT") : "";
            modalBody.innerHTML = `
                <p class="modal-text">Complimenti! Il tuo gadget all'apertura:<br><strong style="color:var(--gold-light);font-size:1.15rem;">${escapeHtml(prizeName)}</strong></p>
                <p class="modal-text" style="margin:10px 0 4px;">Ti abbiamo inviato il <strong>token via email</strong>. Controlla anche lo spam.</p>
                ${until ? `<p style="font-size:0.85rem;color:var(--muted);">Valido fino al: ${escapeHtml(until)}</p>` : ""}
                <p style="font-size:0.85rem;color:var(--muted);margin-top:8px;">Mostra il token alla cassa all'apertura per ritirare il tuo gadget.</p>
            `;
        }
        resultModal.classList.add("active");
    }

    async function showResult(prizeName) {
        playWinSound();
        setTimeout(() => playWinSound(), 200);
        setTimeout(() => playWinSound(), 400);

        const email = (localStorage.getItem("puccioQuiz_email") || "").trim();
        if (!email) {
            renderPrizeModal(prizeName, "", "Email non trovata. Torna al quiz e invia di nuovo il modulo.", false);
            return;
        }
        try {
            const r = await fetch((await resolvePuccioApiBase()) + "/api/spin-result", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, prizeName: prizeName })
            });
            const j = await r.json().catch(function () { return {}; });
            if (r.status === 409) {
                renderPrizeModal(prizeName, j.prize_valid_until || "", j.error || "Hai già girato la ruota con questa email.", false);
                lockWheelUi("Già utilizzata");
                return;
            }
            if (!r.ok || !j.ok) {
                const errText = (j && j.error ? String(j.error) : ("Errore server (" + r.status + ")"));
                const extraHtml =
                    escapeHtml(errText) +
                    "<br><br><button id=\"resendBtn\" style=\"margin-top:10px;font-size:14px;padding:10px 22px;background:linear-gradient(135deg,var(--bordeaux),#5c0f1c);color:var(--cream);border:none;border-radius:10px;cursor:pointer;font-weight:700;\">Reinvia email</button>";
                renderPrizeModal(prizeName, j.prize_valid_until || "", extraHtml, true);
                setTimeout(() => {
                    const btn = document.getElementById("resendBtn");
                    if (!btn) return;
                    btn.addEventListener("click", async () => {
                        btn.disabled = true;
                        btn.textContent = "Invio...";
                        try {
                            const rr = await fetch((await resolvePuccioApiBase()) + "/api/resend-token", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ email })
                            });
                            const jj = await rr.json().catch(() => ({}));
                            if (!rr.ok || !jj.ok) throw new Error(jj.error || ("HTTP " + rr.status));
                            btn.textContent = "Inviata!";
                        } catch (e) {
                            btn.textContent = "Errore: riprova";
                            btn.disabled = false;
                        }
                    });
                }, 0);
                return;
            }
            renderPrizeModal(prizeName, j.prize_valid_until, "", false);
            lockWheelUi("Già utilizzata");
        } catch (e) {
            renderPrizeModal(prizeName, "", "Connessione al server non riuscita.", false);
        }
    }

    spinBtn.addEventListener("click", spinWheel);
    closeModalBtn.addEventListener("click", () => {
        resultModal.classList.remove("active");
    });
    exitBtn.addEventListener("click", () => {
        tryExitPage();
    });

    (async function initPage() {
        await resolvePuccioApiBase().catch(function () {});
        await bootstrapWheelPage();
        drawWheel();
    })();
</script>
</body>
</html>
