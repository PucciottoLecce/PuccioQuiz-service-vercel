<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PuccioQuiz — Fine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#080706;
      --surface:#110f0d;
      --surface2:#181410;
      --bordeaux:#8b1a2e;
      --bordeaux-bright:#c0243d;
      --gold:#c9a84c;
      --gold-light:#e8c96a;
      --cream:#f0e8d8;
      --muted:#a09080;
      --sage:#8fa87e;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{
      min-height:100vh;
      background:var(--bg);
      color:var(--cream);
      font-family:'DM Sans',system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    body::before{
      content:'';
      position:fixed;inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity:0.025;pointer-events:none;z-index:0;
    }
    body::after{
      content:'';
      position:fixed;inset:0;
      background:radial-gradient(ellipse 60% 40% at 50% 60%, rgba(201,168,76,0.05) 0%, transparent 70%);
      pointer-events:none;z-index:0;
    }

    .card{
      position:relative;z-index:1;
      width:min(520px,100%);
      background:linear-gradient(160deg,rgba(255,255,255,0.022) 0%,rgba(255,255,255,0.007) 100%);
      border:1px solid rgba(255,255,255,0.055);
      border-radius:20px;
      box-shadow:0 24px 80px rgba(0,0,0,0.75);
      padding:40px 36px 34px;
      text-align:center;
      overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(201,168,76,0.2),transparent);
    }

    .logo-wrap{
      width:72px;height:72px;border-radius:50%;
      background:var(--surface2);
      border:1px solid rgba(201,168,76,0.15);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 22px;
    }
    .logo-wrap img{ width:68%;height:68%;object-fit:contain; }

    h1{
      font-family:'Playfair Display',serif;
      font-size:1.8rem;font-weight:900;
      line-height:1.1;letter-spacing:-0.02em;
      color:var(--cream);margin-bottom:12px;
    }
    p{
      color:var(--muted);font-size:14.5px;line-height:1.65;margin-bottom:0;
    }

    .actions{
      margin-top:24px;
      display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    }
    button{
      padding:12px 22px;
      border-radius:12px;border:none;
      font-family:'DM Sans',sans-serif;
      font-size:14px;font-weight:700;cursor:pointer;
      transition:transform 0.14s;
    }
    button:hover{ transform:translateY(-1px); }
    button.primary{
      background:linear-gradient(135deg,var(--bordeaux),#5c0f1c);
      color:var(--cream);
      box-shadow:0 8px 24px rgba(139,26,46,0.25);
    }
    button.secondary{
      background:transparent;color:var(--muted);
      border:1px solid rgba(255,255,255,0.08);
    }
    .small{
      margin-top:16px;font-size:11.5px;
      color:rgba(160,144,128,0.5);
    }
  </style>
</head>
<body>
  <div class="card" role="main" aria-label="Fine gioco">
    <div class="logo-wrap" aria-hidden="true">
      <img src="logol.svg" alt="Pucciotto" />
    </div>

    <h1>Grazie per aver partecipato</h1>
    <p>L'iniziativa promozionale è terminata. Se questa pagina non si chiude automaticamente, puoi uscire con il pulsante qui sotto.</p>

    <div class="actions">
      <button id="closeBtn" class="primary" type="button">Chiudi</button>
      <button id="backBtn" class="secondary" type="button">Torna all'inizio</button>
    </div>
    <div class="small" id="hint"></div>
  </div>

  <script>
    (function(){
      function getExitFromQuery(){
        const params = new URLSearchParams(window.location.search);
        const v = params.get('exit');
        try {
          return v ? decodeURIComponent(v) : 'about:blank';
        } catch(_) {
          return 'about:blank';
        }
      }

      const exitUrl = getExitFromQuery();
      const hint = document.getElementById('hint');
      hint.textContent = exitUrl && exitUrl !== 'about:blank'
        ? ('Uscita: ' + exitUrl)
        : '';

      function attemptClose(){
        try { window.close(); } catch(_) {}
        setTimeout(() => { window.location.href = exitUrl || 'about:blank'; }, 250);
      }

      document.getElementById('closeBtn').addEventListener('click', attemptClose);
      document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      setTimeout(attemptClose, 3000);
    })();
  </script>
</body>
</html>
